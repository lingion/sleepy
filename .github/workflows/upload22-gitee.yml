name: Upload remaining sleepy APKs to Gitee
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: upload
        timeout-minutes: 165
        run: |
          python3 -u <<'PYEOF'
          import json, os, re, subprocess, sys, time, urllib.request, urllib.parse

          GITEE_TOKEN = os.environ["GITEE_TOKEN"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          GE = "https://gitee.com/api/v5"
          GH = "https://api.github.com"

          def gh_req(path):
              req = urllib.request.Request(f"{GH}{path}", headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read())

          def gitee_get(path):
              sep = "&" if "?" in path else "?"
              out = subprocess.run(["curl", "-s", "--max-time", "120",
                                    f"{GE}{path}{sep}access_token={GITEE_TOKEN}"],
                                   capture_output=True, text=True)
              try: return json.loads(out.stdout)
              except Exception: return None

          def gitee_form(method, path, fields):
              data = "&".join(f"{k}={urllib.parse.quote(str(v), safe='')}" for k, v in fields.items()).encode()
              req = urllib.request.Request(f"{GE}{path}", data=data, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read())
              except Exception as e:
                  body = ""
                  if hasattr(e, "read"):
                      try: body = e.read().decode("utf-8", "replace")[:200]
                      except Exception: pass
                  print(f"    form {method} {path.split('?')[0]} err: {e} {body}")
                  return None

          def gh_download(asset_id, dest):
              for attempt in (1, 2, 3):
                  r = subprocess.run(["curl", "-sfL", "--retry", "3", "--max-time", "900",
                                      "-H", f"Authorization: Bearer {GH_TOKEN}",
                                      "-H", "Accept: application/octet-stream",
                                      "-o", dest,
                                      f"{GH}/repos/lingion/sleepy/releases/assets/{asset_id}"])
                  if r.returncode == 0 and os.path.exists(dest) and os.path.getsize(dest) > 0:
                      return
                  time.sleep(8)
              raise RuntimeError(f"download failed asset {asset_id}")

          def gitee_upload(rel_id, filepath, fname):
              # returns True on confirmed landing
              for attempt in (1, 2, 3):
                  out = subprocess.run(["curl", "-s", "--max-time", "900", "-X", "POST",
                                        f"{GE}/repos/lingion/sleepy/releases/{rel_id}/attach_files",
                                        "-F", f"access_token={GITEE_TOKEN}",
                                        "-F", f"file=@{filepath}"],
                                       capture_output=True, text=True)
                  resp = None
                  try: resp = json.loads(out.stdout)
                  except Exception: pass
                  if isinstance(resp, dict) and resp.get("id"):
                      print(f"    uploaded id={resp['id']} size={resp.get('size')}")
                      return True
                  print(f"    attempt {attempt}: resp={out.stdout[:150]!r}")
                  time.sleep(20 * attempt)
              return False

          # collect GitHub releases (oldest first so Gitee page order = newest top)
          rels = gh_req("/repos/lingion/sleepy/releases?per_page=100&page=1")
          rels.sort(key=lambda r: r.get("created_at") or "")
          ok = fail = 0
          for rel in rels:
              tag = rel["tag_name"]
              cur = gitee_get(f"/repos/lingion/sleepy/releases/tags/{tag}")
              if not (isinstance(cur, dict) and cur.get("id")):
                  # create release (rare: v1.0.40/41 missing)
                  created = gitee_form("POST", "/repos/lingion/sleepy/releases", {
                      "access_token": GITEE_TOKEN, "tag_name": tag,
                      "target_commitish": "main",
                      "name": rel.get("name") or tag,
                      "prerelease": "true" if rel.get("prerelease") else "false",
                      "body": rel.get("body") or ""})
                  if not (isinstance(created, dict) and created.get("id")):
                      print(f"!! {tag}: create release failed")
                      fail += 1
                      continue
                  cur = created
              rel_id = cur["id"]
              atts = gitee_get(f"/repos/lingion/sleepy/releases/{rel_id}/attach_files")
              have = set()
              if isinstance(atts, list):
                  for a in atts:
                      n = re.sub(r"^(sleepy|asset)_\d+_", "", a.get("name") or "")
                      have.add(n)
              for a in rel.get("assets", []):
                  aname = a["name"]
                  if aname.endswith(("-source.zip", "-source.tar.gz", ".source.zip")):
                      continue
                  if aname in have:
                      continue
                  print(f"{tag}: uploading {aname} ({a['size']/1048576:.1f} MB)")
                  dest = f"/tmp/a_{a['id']}"
                  try:
                      gh_download(a["id"], dest)
                      if gitee_upload(rel_id, dest, aname):
                          ok += 1
                      else:
                          fail += 1
                          print(f"  !! {tag}: {aname} FAILED after retries")
                  except Exception as e:
                      fail += 1
                      print(f"  !! {tag}: {aname}: {e}")
                  finally:
                      if os.path.exists(dest): os.remove(dest)
                  time.sleep(10)  # let Gitee quota cache breathe
          print(f"DONE ok={ok} fail={fail}")
          sys.exit(1 if fail else 0)
          PYEOF
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
