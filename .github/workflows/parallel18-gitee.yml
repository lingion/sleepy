name: Parallel upload missing APKs
on:
  workflow_dispatch:
    inputs:
      shard:
        description: "shard index 0-3"
        required: true
        type: string
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 4
    steps:
      - name: upload-shard
        timeout-minutes: 55
        run: |
          python3 -u <<'PYEOF'
          import json, os, re, subprocess, sys, time, urllib.request, urllib.parse

          GITEE_TOKEN = os.environ["GITEE_TOKEN"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          GE = "https://gitee.com/api/v5"
          GH = "https://api.github.com"
          SHARD = int(os.environ["SHARD"]) % 4

          def gh_req(path):
              req = urllib.request.Request(f"{GH}{path}", headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read())

          def gitee_atts(rid):
              o = subprocess.run(["curl","-s","--max-time","120",
                  f"{GE}/repos/lingion/sleepy/releases/{rid}/attach_files?access_token={GITEE_TOKEN}"],
                  capture_output=True, text=True)
              try: d = json.loads(o.stdout)
              except Exception: return []
              return d if isinstance(d, list) else []

          def gitee_rid(tag):
              o = subprocess.run(["curl","-s","--max-time","120",
                  f"{GE}/repos/lingion/sleepy/releases/tags/{tag}?access_token={GITEE_TOKEN}"],
                  capture_output=True, text=True)
              try: return json.loads(o.stdout).get("id")
              except Exception: return None

          def gh_download(asset_id, dest):
              for attempt in (1,2,3):
                  r = subprocess.run(["curl","-sfL","--retry","3","--max-time","600",
                      "-H",f"Authorization: Bearer {GH_TOKEN}",
                      "-H","Accept: application/octet-stream",
                      "-o",dest,
                      f"{GH}/repos/lingion/sleepy/releases/assets/{asset_id}"])
                  if r.returncode == 0 and os.path.getsize(dest) > 0:
                      return
                  time.sleep(8)
              raise RuntimeError(f"download failed {asset_id}")

          def gitee_upload(rid, filepath, orig_name):
              for attempt in (1,2,3):
                  o = subprocess.run(["curl","-s","--max-time","600","-X","POST",
                      f"{GE}/repos/lingion/sleepy/releases/{rid}/attach_files",
                      "-F",f"access_token={GITEE_TOKEN}",
                      "-F",f"file=@{filepath};filename={orig_name}"], capture_output=True, text=True)
                  try: d = json.loads(o.stdout)
                  except Exception: d = None
                  if isinstance(d, dict) and d.get("id"):
                      print(f"    uploaded id={d['id']} name={d.get('name')}", flush=True)
                      return True
                  print(f"    att{attempt} resp={o.stdout[:120]!r}", flush=True)
                  time.sleep(20*attempt)
              return False

          rels_gh = gh_req("/repos/lingion/sleepy/releases?per_page=100&page=1")
          rels_gh.sort(key=lambda r: r.get("created_at") or "")
          # build global missing list
          gitee_have = set()
          o = subprocess.run(["curl","-s","--max-time","120",
              f"{GE}/repos/lingion/sleepy/releases?page=1&per_page=100&access_token={GITEE_TOKEN}"],
              capture_output=True, text=True)
          pat = re.compile(r"^(sleepy|asset)_\d+_")
          for r in json.loads(o.stdout):
              for a in r.get("assets") or []:
                  if "/download/" in a.get("browser_download_url",""):
                      gitee_have.add(r["tag_name"] + "|" + pat.sub("", a["name"]))
          missing = []
          for rel in rels_gh:
              for a in rel.get("assets", []):
                  an = a["name"]
                  if an.endswith(("-source.zip","-source.tar.gz",".source.zip")): continue
                  k = rel["tag_name"] + "|" + an
                  if k not in gitee_have:
                      missing.append((rel, a))
          mine = [m for i, m in enumerate(missing) if i % 4 == SHARD]
          print(f"shard {SHARD}: {len(mine)}/{len(missing)} missing", flush=True)
          ok = fail = 0
          for rel, a in mine:
              tag = rel["tag_name"]; an = a["name"]
              rid = gitee_rid(tag)
              if not rid:
                  print(f"!! {tag}: no release", flush=True); fail += 1; continue
              print(f"{tag} <- {an}", flush=True)
              dest = f"/tmp/p_{a['id']}_{an}"
              try:
                  gh_download(a["id"], dest)
                  if gitee_upload(rid, dest, an): ok += 1
                  else: fail += 1; print(f"  !! failed {tag}/{an}", flush=True)
              except Exception as e:
                  fail += 1; print(f"  !! {e}", flush=True)
              finally:
                  if os.path.exists(dest): os.remove(dest)
          print(f"SHARD {SHARD} DONE ok={ok} fail={fail}", flush=True)
          sys.exit(1 if fail else 0)
          PYEOF
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD: ${{ inputs.shard }}
