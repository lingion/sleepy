name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint PR commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
          # squash 合并后 PR 里每条 commit 都会进 main 历史, 逐条校验
          git fetch origin "$BASE_REF" --depth=200
          npx commitlint --from "origin/$BASE_REF" --to HEAD --verbose

  school-catalog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Debug APK workflow contracts
        run: python3 -m unittest discover -s scripts -p 'test_debug_*.py'
      - name: Released public documentation contracts
        run: python3 -m unittest discover -s scripts -p test_public_docs.py
      - name: Attribution inventory and bundled notices
        run: python3 scripts/test_attributions.py
      - name: Verify source coverage and reproducible school catalog
        run: |
          python3 scripts/test_catalog_url_safety.py
          python3 scripts/test_catalog_ownership.py
          python3 scripts/test_declared_protocol_routes.py
          python3 -m unittest discover -s scripts -p test_school_locations.py
          python3 scripts/generate_school_catalog.py --check
          python3 scripts/enrich_school_cities.py
          python3 scripts/build_school_location_evidence.py
          python3 scripts/generate_schools_list.py
          git diff --exit-code -- app/src/main/assets/school_cities.json scripts/data/school_location_evidence.json docs/catalog/location-evidence.md docs/schools-list.md

  collector-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/sleepy-collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/sleepy-collector/go.mod
          cache-dependency-path: tools/sleepy-collector/go.sum
      - run: go vet ./...
      - run: go test ./...

  jw-fetch-js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Execute SEU and WISEDU WebView fetch contracts
        run: node tools/test-seu-fetch.js
      - name: Execute school timetable fetch contracts
        run: |
          node tools/test-cf-new-fetch.js
          node tools/test-classic-eams-fetch.js
          node tools/test-chaoxing-share-fetch.js
          node tools/test-chaoxing-fetch.js
          node tools/test-jlu-fetch.js
          node tools/test-paged-school-fetch.js
          node tools/test-school-api-fetch.js
          node tools/test-whut-fetch.js
          node scripts/test_sues_capture.cjs
          node scripts/test_thu_capture.cjs
          node scripts/test_buaa_capture.cjs
          node scripts/test_json_school_capture.cjs
          node scripts/test_school_api_paged_context.cjs
          node scripts/test_treewise_json_capture.cjs

  android-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric 的 android-all jar (~150MB, 供 JVM 像素 golden 测试用) 走
      # ~/.m2 而非 Gradle 依赖缓存, setup-gradle 不会帮你存; 不缓存则每次 PR 重下。
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-
      - name: Unit tests and Room schema check
        # pipefail 必须显式开: 无它时 gradle 非零退出码被 tail 吞掉, 红测试假绿
        # (issue #98: preview_skips_ink_guard 红但 android-unit-test 绿, 差点带病合入)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --info --stacktrace 2>&1 | tee gradle-unit-test.log | tail -400
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - name: Release console lifecycle
        run: ./gradlew -I scripts/console-lifecycle.init.gradle :app:testReleaseUnitTest --tests '*ReleaseConsoleLifecycleTest' --stacktrace

  android-lint:
    # Lint uses app/lint-baseline.xml for accepted legacy findings; new findings fail CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 7

  android-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: apks-debug-signing
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
