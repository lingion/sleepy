name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-notes-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check out the website consumer
        uses: actions/checkout@v7
        with:
          repository: lingion/sleepy-site
          # Verify against the reviewed production consumer, including its lockfile.
          ref: 5e79170d01aa419efc5662f39125a1772a0cab26
          path: .release-notes-site
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .release-notes-site/package-lock.json
      - name: Install website dependencies
        run: npm ci --prefix .release-notes-site
      - name: Exercise the live website data pipeline
        working-directory: .release-notes-site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run data
      - name: Stage the unpublished release notes in the disposable website checkout
        run: |
          notes=$(find docs -maxdepth 1 -name 'release-notes-v*.md' | sort -V | tail -1)
          node scripts/prepare_release_notes_site.mjs "$notes" .release-notes-site
          test -s .release-notes-site/candidate-mirror.html
      - name: Run the website CI rendering gates with the candidate body
        working-directory: .release-notes-site
        run: |
          npm run tokens
          git diff --exit-code -- src/tokens/
          npm run check
          npm run build
          npm test
          node scripts/audit-seo.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-
      - name: Render the actual update dialog and check GitHub and mirror parsing
        env:
          SLEEPY_RELEASE_MIRROR_FIXTURE: ${{ github.workspace }}/.release-notes-site/candidate-mirror.html
        run: ./gradlew :app:testDebugUnitTest --tests '*ReleaseNotesContractTest' --tests '*ReleaseNotesDialogTest' --stacktrace
      - name: Upload release rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-rendering
          include-hidden-files: true
          path: |
            app/build/reports/release-notes/
            app/build/reports/tests/testDebugUnitTest/
            .release-notes-site/dist/client/releases/
            .release-notes-site/dist/client/en/releases/
          retention-days: 7

  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint commit messages
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          COMMIT_FROM: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: |
          set -euo pipefail
          npm install -g @commitlint/cli @commitlint/config-conventional
          # PR 校验分支范围，main 校验推送范围，手动运行校验所选提交。
          git fetch origin "$BASE_REF" --depth=200
          # 只排除 Git 确认的合并提交；普通提交仍逐条校验完整消息。
          commits="$(git rev-list --reverse --no-merges "$COMMIT_FROM..HEAD")"
          if [ -z "$commits" ]; then
            echo "No non-merge commits to lint."
            exit 0
          fi
          while IFS= read -r commit; do
            git show --format=%B --no-patch "$commit" | npx commitlint --verbose
          done <<< "$commits"

  school-catalog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: JDK version and bootstrap consistency
        run: |
          python3 scripts/jdk_config.py --check
          python3 -m unittest discover -s scripts -p test_jdk_config.py
      - name: Debug APK workflow contracts
        run: python3 -m unittest discover -s scripts -p 'test_debug_*.py'
      - name: Attribution inventory and bundled notices
        run: python3 scripts/test_attributions.py
      - name: Verify source coverage and reproducible school catalog
        run: |
          python3 scripts/test_catalog_url_safety.py
          python3 scripts/test_catalog_ownership.py
          python3 scripts/test_declared_protocol_routes.py
          python3 -m unittest discover -s scripts -p test_school_locations.py
          python3 scripts/generate_school_catalog.py --check
          python3 scripts/enrich_school_cities.py
          python3 scripts/build_school_location_evidence.py
          python3 scripts/generate_schools_list.py
          git diff --exit-code -- app/src/main/assets/school_cities.json scripts/data/school_location_evidence.json docs/catalog/location-evidence.md docs/schools-list.md

  collector-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/sleepy-collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/sleepy-collector/go.mod
          cache-dependency-path: tools/sleepy-collector/go.sum
      - run: go vet -p 1 ./...
      - name: Collector unit and browser integration tests
        env:
          SLEEPY_CFT_E2E: '1'
        run: go test -p 1 -parallel 1 ./...

  jw-fetch-js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Execute SEU and WISEDU WebView fetch contracts
        run: node tools/test-seu-fetch.js
      - name: Execute school timetable fetch contracts
        run: |
          node tools/test-cf-new-fetch.js
          node tools/test-zf-new-fetch.js
          node tools/test-classic-eams-fetch.js
          node tools/test-weekly-fetch.js
          node tools/test-chaoxing-share-fetch.js
          node tools/test-chaoxing-fetch.js
          node tools/test-jlu-fetch.js
          node tools/test-paged-school-fetch.js
          node tools/test-school-api-fetch.js
          node tools/test-whut-fetch.js
          node tools/test-sg-asset-bridge.js
          node tools/test-sg-asset-interaction.js
          node tools/test-ustc-fetch.js
          node tools/test-fdu-fetch.js
          node tools/test-ahu-fetch.js
          node scripts/test_sues_capture.cjs
          node scripts/test_thu_capture.cjs
          node scripts/test_buaa_capture.cjs
          node scripts/test_json_school_capture.cjs
          node scripts/test_school_api_paged_context.cjs
          node scripts/test_treewise_json_capture.cjs

  android-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric 的 android-all jar (~150MB, 供 JVM 像素 golden 测试用) 走
      # ~/.m2 而非 Gradle 依赖缓存, setup-gradle 不会帮你存; 不缓存则每次 PR 重下。
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-
      - name: Unit tests and Room schema check
        # pipefail 必须显式开: 无它时 gradle 非零退出码被 tail 吞掉, 红测试假绿
        # (issue #98: preview_skips_ink_guard 红但 android-unit-test 绿, 差点带病合入)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :liquid-glass-runtime:testAndroidHostTest --info --stacktrace 2>&1 | tee gradle-unit-test.log | tail -400
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - name: Release console lifecycle
        run: ./gradlew -I scripts/console-lifecycle.init.gradle :app:testReleaseUnitTest --tests '*ReleaseConsoleLifecycleTest' --stacktrace

  android-lint:
    # Lint uses app/lint-baseline.xml for accepted legacy findings; new findings fail CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 7

  android-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: apks-debug-signing
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
