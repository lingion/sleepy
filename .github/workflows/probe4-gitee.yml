name: Tiny probe
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: t
        timeout-minutes: 8
        run: |
          head -c 2048 /dev/urandom > /tmp/t2.bin
          RID=981622
          curl -s --max-time 120 -X POST \
            "https://gitee.com/api/v5/repos/lingion/sleepy/releases/$RID/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@/tmp/t2.bin;filename=t2.bin" -w "\nHTTP:%{http_code}\n" | tail -2
          # 删掉
          AID=$(curl -s "https://gitee.com/api/v5/repos/lingion/sleepy/releases/$RID/attach_files?access_token=${GITEE_TOKEN}" | jq -r '.[] | select(.name=="t2.bin") | .id')
          [ -n "$AID" ] && curl -s -X DELETE -o /dev/null -w "cleanup:%{http_code}\n" \
            "https://gitee.com/api/v5/repos/lingion/sleepy/releases/$RID/attach_files/$AID?access_token=${GITEE_TOKEN}"
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
