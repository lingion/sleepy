name: Sync to Gitee

on:
  push:
    branches: ["**"]
    tags: ["**"]
  release:
    types: [published, edited]
  workflow_dispatch:

concurrency:
  group: gitee-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-git:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror git refs to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git clone --mirror "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo.git
          cd repo.git
          git for-each-ref --format='delete %(refname)' refs/pull | git update-ref --stdin || true
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          # concurrent mirror pushes can race on Gitee (CAS on refs); retry settles it
          for i in 1 2 3; do
            git push --mirror "https://oauth2:${GITEE_TOKEN}@gitee.com/lingion/${REPO_NAME}.git" && break
            echo "mirror push attempt $i failed; retrying in 15s"
            sleep 15
          done

  sync-release:
    runs-on: ubuntu-latest
    needs: sync-git
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    steps:
      - name: Sync releases to Gitee (full catch-up on dispatch, incremental on release)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys, time, urllib.error, urllib.parse, urllib.request

          GITEE_TOKEN = os.environ["GITEE_TOKEN"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          GITHUB_REPO = os.environ["GITHUB_REPOSITORY"]
          REPO = GITHUB_REPO.split("/")[-1]
          OWNER = "lingion"
          GH = "https://api.github.com"
          GE = "https://gitee.com/api/v5"

          # Gitee attachment quota is 1 GB per repo. When full, evict assets of the
          # oldest releases (rolling window) — newest versions always win. Eviction
          # is attempted at most once per run; freed quota reconciles on Gitee's
          # side with a delay, so leftovers are picked up by the healer cron.

          def gh_req(path):
              req = urllib.request.Request(f"{GH}{path}", headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read())

          def curl_json(args):
              out = subprocess.run(args, capture_output=True, text=True)
              try:
                  return json.loads(out.stdout)
              except Exception:
                  return None

          def curl_text(args):
              out = subprocess.run(args, capture_output=True, text=True)
              return out.stdout or ""

          def gitee_get(path):
              sep = "&" if "?" in path else "?"
              return curl_json(["curl", "-s", "--max-time", "120",
                                f"{GE}{path}{sep}access_token={GITEE_TOKEN}"])

          def gitee_form(method, path, fields):
              # urlencoded form; Gitee rejects multipart bodies for release notes ("body is invalid")
              data = "&".join(f"{k}={urllib.parse.quote(str(v), safe='')}" for k, v in fields.items()).encode()
              req = urllib.request.Request(f"{GE}{path}", data=data, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try:
                      return json.loads(e.read())
                  except Exception:
                      return {"http_status": e.code}

          def gitee_post(path, fields):
              return gitee_form("POST", path, fields)

          def gitee_patch(path, fields):
              return gitee_form("PATCH", path, fields)

          def gh_download(asset_id, dest):
              for attempt in (1, 2):
                  r = subprocess.run(["curl", "-sfL", "--retry", "3", "--max-time", "1800",
                                      "-H", f"Authorization: Bearer {GH_TOKEN}",
                                      "-H", "Accept: application/octet-stream",
                                      "-o", dest, f"{GH}/repos/{GITHUB_REPO}/releases/assets/{asset_id}"])
                  if r.returncode == 0 and os.path.exists(dest) and os.path.getsize(dest) > 0:
                      return True
                  time.sleep(5)
              return False

          def gitee_upload(rel_id, filepath, orig_name):
              # returns "ok" | "quota" | "fail"
              out = curl_text(["curl", "-s", "--max-time", "1800", "-X", "POST",
                               f"{GE}/repos/{OWNER}/{REPO}/releases/{rel_id}/attach_files",
                               "-F", f"access_token={GITEE_TOKEN}",
                               "-F", f"file=@{filepath};filename={orig_name}"])
              d = None
              try:
                  d = json.loads(out)
              except Exception:
                  pass
              if isinstance(d, dict) and d.get("id"):
                  return "ok"
              print(f"    upload resp={out[:110]!r}", flush=True)
              return "quota" if ("配额" in out) else "fail"

          def gitee_delete_att(rel_id, aid):
              curl_text(["curl", "-s", "--max-time", "120", "-X", "DELETE",
                         f"{GE}/repos/{OWNER}/{REPO}/releases/{rel_id}/attach_files/{aid}?access_token={GITEE_TOKEN}"])

          def vkey(tag):
              m = re.findall(r"\d+", tag or "")
              return tuple(int(x) for x in m) if m else (0,)

          evict_used = [False]

          def evict_until(need_bytes, protect_tags):
              # delete attachments of oldest unprotected releases until >= need freed
              if evict_used[0]:
                  return 0
              evict_used[0] = True
              rels, page = [], 1
              while True:
                  d = gitee_get(f"/repos/{OWNER}/{REPO}/releases?page={page}&per_page=100")
                  if not isinstance(d, list) or not d:
                      break
                  rels.extend(d)
                  if len(d) < 100:
                      break
                  page += 1
              rels.sort(key=lambda r: vkey(r.get("tag_name")))
              # if every release holding attachments is protected, sacrifice the oldest
              # protected one (its own missing asset needs the space anyway — net update)
              sacrificial = [r for r in rels if r.get("tag_name") not in protect_tags]
              if not sacrificial:
                  protected_with_atts = [r for r in rels if r.get("tag_name") in protect_tags]
                  if protected_with_atts:
                      protect_tags = protect_tags - {protected_with_atts[0].get("tag_name")}
              freed = 0
              for r in rels:
                  if freed >= need_bytes:
                      break
                  tag = r.get("tag_name")
                  if tag in protect_tags:
                      continue
                  atts = gitee_get(f"/repos/{OWNER}/{REPO}/releases/{r.get('id')}/attach_files")
                  if not isinstance(atts, list) or not atts:
                      continue
                  for a in atts:
                      gitee_delete_att(r.get("id"), a.get("id"))
                      freed += a.get("size") or 0
                      time.sleep(1)
                  print(f"  evicted {tag}: {len(atts)} files ~{sum(a.get('size') or 0 for a in atts)/1048576:.1f} MB for newer versions", flush=True)
              return freed

          # --- rolling retention window: newest-first until quota budget is used up ---
          QUOTA_BUDGET = 980 * 1048576   # leave headroom under the 1 GB Gitee cap
          all_gh_rels = []
          pg = 1
          while True:
              chunk = gh_req(f"/repos/{GITHUB_REPO}/releases?per_page=100&page={pg}")
              if not chunk:
                  break
              all_gh_rels.extend(chunk)
              if len(chunk) < 100:
                  break
              pg += 1
          all_gh_rels.sort(key=lambda r: vkey(r.get("tag_name")), reverse=True)
          keep_tags = set()
          budget = QUOTA_BUDGET
          for r in all_gh_rels:
              need = sum(a.get("size", 0) for a in r.get("assets", [])
                         if not a["name"].endswith(("-source.zip","-source.tar.gz",".source.zip")))
              if need <= budget:
                  keep_tags.add(r["tag_name"])
                  budget -= need
              # releases with no attachments always stay in the window
              if need == 0:
                  keep_tags.add(r["tag_name"])
          print(f"retention window keeps {len(keep_tags)}/{len(all_gh_rels)} releases within {QUOTA_BUDGET//1048576} MB budget", flush=True)

          default_branch = gh_req(f"/repos/{GITHUB_REPO}")["default_branch"]
          synced = failed = deferred = 0
          page = 1
          while True:
              rels = gh_req(f"/repos/{GITHUB_REPO}/releases?per_page=100&page={page}")
              if not rels:
                  break
              # Gitee web UI sorts releases by created_at ascending; newest must be created last
              # to land on top. Process oldest-first to mimic GitHub release creation order.
              rels.sort(key=lambda r: r.get("created_at") or "")
              for rel in rels:
                  tag = rel["tag_name"]
                  name = rel.get("name") or tag
                  pre = "true" if rel.get("prerelease") else "false"
                  try:
                      body_text = rel.get("body") or ""
                      cur = gitee_get(f"/repos/{OWNER}/{REPO}/releases/tags/{tag}")
                      if isinstance(cur, dict) and cur.get("id"):
                          rel_id = cur["id"]
                          gitee_patch(f"/repos/{OWNER}/{REPO}/releases/{rel_id}", {
                              "access_token": GITEE_TOKEN, "tag_name": tag,
                              "name": name, "prerelease": pre,
                              "body": body_text})
                      else:
                          created = gitee_post(f"/repos/{OWNER}/{REPO}/releases", {
                              "access_token": GITEE_TOKEN, "tag_name": tag,
                              "target_commitish": default_branch,
                              "name": name, "prerelease": pre,
                              "body": body_text})
                          rel_id = created.get("id") if isinstance(created, dict) else None
                          if not rel_id:
                              raise RuntimeError(f"create failed: {json.dumps(created)[:200] if created else 'no response'}")
                      atts = gitee_get(f"/repos/{OWNER}/{REPO}/releases/{rel_id}/attach_files")
                      have = set()
                      if isinstance(atts, list):
                          for a in atts:
                              n = a.get("name") or (a.get("browser_download_url") or "").rstrip("/").split("/")[-1]
                              if n:
                                  have.add(n)
                      if tag not in keep_tags:
                          print(f"  ~ {tag}: outside retention window (evicted for newer versions)", flush=True)
                          synced += 1
                          continue
                      for a in rel.get("assets", []):
                          # skip source archives: Gitee release page auto-generates them, save quota
                          aname = a["name"]
                          if aname.endswith(("-source.zip", "-source.tar.gz", ".source.zip")):
                              print(f"  - {tag}: skip source archive {aname}")
                              continue
                          fname = a["name"]
                          if fname in have:
                              print(f"  = {tag}: asset {fname} already present")
                              continue
                          dest = f"/tmp/asset_{a['id']}_{fname}"
                          if not gh_download(a["id"], dest):
                              deferred += 1
                              print(f"  ! {tag}: download failed for {fname}; healer will retry")
                              continue
                          st = gitee_upload(rel_id, dest, fname)
                          if st == "quota":
                              need = os.path.getsize(dest)
                              protect = {r["tag_name"] for r in rels
                                         if vkey(r["tag_name"]) >= vkey(tag)}
                              if evict_until(need, protect) > 0:
                                  st = gitee_upload(rel_id, dest, fname)
                          if st == "ok":
                              synced += 1
                              print(f"  + {tag}: uploaded {fname}")
                          elif st == "quota":
                              deferred += 1
                              print(f"  ~ {tag}: quota still full; {fname} deferred to healer")
                              os.remove(dest)
                              continue
                          else:
                              deferred += 1
                              print(f"  ! {tag}: upload failed for {fname}; healer will retry")
                          os.remove(dest)
                      synced += 1
                      print(f"  ok {tag} ({len(rel.get('assets', []))} assets)")
                  except Exception as e:
                      failed += 1
                      print(f"  !! {tag}: {e}")
                  time.sleep(0.3)
              if len(rels) < 100:
                  break
              page += 1
          print(f"DONE releases synced={synced} deferred={deferred} failed={failed}")
          # deferred items converge via the healer cron; only hard errors fail this run
          sys.exit(1 if failed else 0)
          PYEOF
