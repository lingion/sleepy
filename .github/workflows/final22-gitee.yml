name: Final sync all missing APKs
on:
  workflow_dispatch:
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: upload-missing
        timeout-minutes: 165
        run: |
          python3 -u <<'PYEOF'
          import json, os, re, subprocess, sys, time, urllib.request, urllib.parse

          GITEE_TOKEN = os.environ["GITEE_TOKEN"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          GE = "https://gitee.com/api/v5"
          GH = "https://api.github.com"

          def gh_req(path):
              req = urllib.request.Request(f"{GH}{path}", headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read())

          def gitee_atts(rid):
              o = subprocess.run(["curl","-s","--max-time","120",
                  f"{GE}/repos/lingion/sleepy/releases/{rid}/attach_files?access_token={GITEE_TOKEN}"],
                  capture_output=True, text=True)
              try: d = json.loads(o.stdout)
              except Exception: return []
              return d if isinstance(d, list) else []

          def gitee_rid(tag):
              o = subprocess.run(["curl","-s","--max-time","120",
                  f"{GE}/repos/lingion/sleepy/releases/tags/{tag}?access_token={GITEE_TOKEN}"],
                  capture_output=True, text=True)
              try: return json.loads(o.stdout).get("id")
              except Exception: return None

          def gitee_create(rel):
              data = urllib.parse.urlencode({
                  "access_token": GITEE_TOKEN, "tag_name": rel["tag_name"],
                  "target_commitish": "main",
                  "name": rel.get("name") or rel["tag_name"],
                  "prerelease": "true" if rel.get("prerelease") else "false",
                  "body": rel.get("body") or ""}).encode()
              req = urllib.request.Request(f"{GE}/repos/lingion/sleepy/releases", data=data, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"    create err: {e}")
                  return None

          def gh_download(asset_id, dest):
              for attempt in (1,2,3):
                  r = subprocess.run(["curl","-sfL","--retry","3","--max-time","900",
                      "-H",f"Authorization: Bearer {GH_TOKEN}",
                      "-H","Accept: application/octet-stream",
                      "-o",dest,
                      f"{GH}/repos/lingion/sleepy/releases/assets/{asset_id}"])
                  if r.returncode == 0 and os.path.getsize(dest) > 0:
                      return
                  time.sleep(8)
              raise RuntimeError(f"download failed {asset_id}")

          def gitee_upload(rid, filepath, orig_name):
              for attempt in (1,2,3):
                  o = subprocess.run(["curl","-s","--max-time","900","-X","POST",
                      f"{GE}/repos/lingion/sleepy/releases/{rid}/attach_files",
                      "-F",f"access_token={GITEE_TOKEN}",
                      "-F",f"file=@{filepath};filename={orig_name}"], capture_output=True, text=True)
                  try: d = json.loads(o.stdout)
                  except Exception: d = None
                  if isinstance(d, dict) and d.get("id"):
                      print(f"    uploaded id={d['id']} name={d.get('name')} size={d.get('size')}", flush=True)
                      return True
                  print(f"    att{attempt} resp={o.stdout[:120]!r}", flush=True)
                  time.sleep(25*attempt)
              return False

          rels_gh = gh_req("/repos/lingion/sleepy/releases?per_page=100&page=1")
          rels_gh.sort(key=lambda r: r.get("created_at") or "")
          ok = fail = 0
          for rel in rels_gh:
              tag = rel["tag_name"]
              rid = gitee_rid(tag)
              if not rid:
                  c = gitee_create(rel)
                  rid = c.get("id") if isinstance(c, dict) else None
                  if not rid:
                      print(f"!! {tag}: cannot create", flush=True); fail += 1; continue
              have = {re.sub(r"^(sleepy|asset)_\d+_", "", a.get("name","")) for a in gitee_atts(rid)}
              for a in rel.get("assets", []):
                  an = a["name"]
                  if an.endswith(("-source.zip","-source.tar.gz",".source.zip")): continue
                  if an in have: continue
                  print(f"{tag} <- {an} ({a['size']/1048576:.1f}MB)", flush=True)
                  dest = f"/tmp/asset_{a['id']}_{an}"
                  try:
                      gh_download(a["id"], dest)
                      if gitee_upload(rid, dest, an): ok += 1
                      else: fail += 1; print(f"  !! upload failed {tag}/{an}", flush=True)
                  except Exception as e:
                      fail += 1; print(f"  !! {e}", flush=True)
                  finally:
                      if os.path.exists(dest): os.remove(dest)
                  time.sleep(8)

          # final verify
          have = set()
          page = 1
          while True:
              o = subprocess.run(["curl","-s","--max-time","120",
                  f"{GE}/repos/lingion/sleepy/releases?page={page}&per_page=100&access_token={GITEE_TOKEN}"],
                  capture_output=True, text=True)
              try: d = json.loads(o.stdout)
              except Exception: d = []
              if not d: break
              for r in d:
                  for a in r.get("assets") or []:
                      if "/download/" in a.get("browser_download_url",""):
                          have.add(f"{r['tag_name']}|{re.sub(r'^(sleepy|asset)_\d+_', '', a['name'])}")
              if len(d) < 100: break
              page += 1
          missing = []
          for rel in rels_gh:
              for a in rel.get("assets", []):
                  an = a["name"]
                  if an.endswith(("-source.zip","-source.tar.gz",".source.zip")): continue
                  if f"{rel['tag_name']}|{an}" not in have:
                      missing.append(f"{rel['tag_name']}|{an}")
          print(f"VERIFY: ok={ok} fail={fail} missing={len(missing)}", flush=True)
          for m in missing: print(f"   MISSING {m}", flush=True)
          sys.exit(1 if (fail or missing) else 0)
          PYEOF
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
