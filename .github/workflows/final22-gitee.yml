name: Final 22 APK sync with quota rollover
on:
  workflow_dispatch:
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: rollover-and-upload
        timeout-minutes: 165
        run: |
          python3 -u <<'PYEOF'
          import json, os, re, subprocess, sys, time, urllib.request, urllib.parse

          GITEE_TOKEN = os.environ["GITEE_TOKEN"]
          GH_TOKEN = os.environ["GH_TOKEN"]
          GE = "https://gitee.com/api/v5"
          GH = "https://api.github.com"

          def gh_req(path):
              req = urllib.request.Request(f"{GH}{path}", headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read())

          def gitee_releases():
              out, page = [], 1
              while True:
                  o = subprocess.run(["curl","-s","--max-time","120",
                      f"{GE}/repos/lingion/sleepy/releases?page={page}&per_page=100&access_token={GITEE_TOKEN}"],
                      capture_output=True, text=True)
                  try: d = json.loads(o.stdout)
                  except Exception: d = []
                  if not d: break
                  out += d
                  if len(d) < 100: break
                  page += 1
              return out

          def gitee_form(method, path, fields):
              data = "&".join(f"{k}={urllib.parse.quote(str(v), safe='')}" for k, v in fields.items()).encode()
              req = urllib.request.Request(f"{GE}{path}", data=data, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read())
              except Exception as e:
                  body = getattr(e, "read", lambda: b"")()
                  print(f"    form err {method} {path.split('?')[0]}: {body[:150]}")
                  return None

          def gitee_atts(rid):
              o = subprocess.run(["curl","-s","--max-time","120",
                  f"{GE}/repos/lingion/sleepy/releases/{rid}/attach_files?access_token={GITEE_TOKEN}"],
                  capture_output=True, text=True)
              try: d = json.loads(o.stdout)
              except Exception: return []
              return d if isinstance(d, list) else []

          def gitee_delete(rid, aid):
              o = subprocess.run(["curl","-s","-X","DELETE","--max-time","120","-w","%{http_code}",
                  f"{GE}/repos/lingion/sleepy/releases/{rid}/attach_files/{aid}?access_token={GITEE_TOKEN}"],
                  capture_output=True, text=True)
              return o.stdout

          def gh_download(asset_id, dest):
              for attempt in (1,2,3):
                  r = subprocess.run(["curl","-sfL","--retry","3","--max-time","900",
                      "-H",f"Authorization: Bearer {GH_TOKEN}",
                      "-H","Accept: application/octet-stream",
                      "-o",dest,
                      f"{GH}/repos/lingion/sleepy/releases/assets/{asset_id}"])
                  if r.returncode == 0 and os.path.getsize(dest) > 0:
                      return
                  time.sleep(8)
              raise RuntimeError(f"download failed {asset_id}")

          def gitee_upload(rid, filepath):
              for attempt in (1,2,3):
                  o = subprocess.run(["curl","-s","--max-time","900","-X","POST",
                      f"{GE}/repos/lingion/sleepy/releases/{rid}/attach_files",
                      "-F",f"access_token={GITEE_TOKEN}",
                      "-F",f"file=@{filepath}"], capture_output=True, text=True)
                  try: d = json.loads(o.stdout)
                  except Exception: d = None
                  if isinstance(d, dict) and d.get("id"):
                      print(f"    uploaded id={d['id']} size={d.get('size')}")
                      return True
                  print(f"    att{attempt} resp={o.stdout[:120]!r}")
                  time.sleep(25*attempt)
              return False

          # ---- Phase A: free quota by removing pool assets (they will be re-uploaded in Phase C)
          POOL = [("v1.0.2","app-arm64-v8a-debug.apk"),
                  ("v1.0.16","sleepy-v1.0.16-2-arm64-v8a.apk")]
          rels_g = gitee_releases()
          relmap = {r["tag_name"]: r["id"] for r in rels_g}
          for tag, aname in POOL:
              rid = relmap[tag]
              for a in gitee_atts(rid):
                  if re.sub(r"^(sleepy|asset)_\d+_", "", a.get("name","")) == aname:
                      code = gitee_delete(rid, a["id"])
                      print(f"A: freed {tag}/{aname} (aid={a['id']}, {a.get('size',0)/1048576:.1f}MB) -> {code}")
          time.sleep(15)

          # ---- Phase B: upload all missing (oldest tag first keeps Gitee page order newest-top)
          rels_gh = gh_req("/repos/lingion/sleepy/releases?per_page=100&page=1")
          rels_gh.sort(key=lambda r: r.get("created_at") or "")
          ok = fail = 0
          for rel in rels_gh:
              tag = rel["tag_name"]
              cur = gitee_form("GET", f"/repos/lingion/sleepy/releases/tags/{tag}", {"access_token": GITEE_TOKEN}) \
                    if False else None
              o = subprocess.run(["curl","-s","--max-time","120",
                  f"{GE}/repos/lingion/sleepy/releases/tags/{tag}?access_token={GITEE_TOKEN}"],
                  capture_output=True, text=True)
              try: cur = json.loads(o.stdout)
              except Exception: cur = None
              rid = cur.get("id") if isinstance(cur, dict) else None
              if not rid:
                  created = gitee_form("POST","/repos/lingion/sleepy/releases",{
                      "access_token":GITEE_TOKEN,"tag_name":tag,"target_commitish":"main",
                      "name": rel.get("name") or tag,
                      "prerelease":"true" if rel.get("prerelease") else "false",
                      "body": rel.get("body") or ""})
                  rid = created.get("id") if isinstance(created,dict) else None
                  if not rid:
                      print(f"!! {tag}: cannot create"); fail+=1; continue
              have = {re.sub(r"^(sleepy|asset)_\d+_(.*)", r"\2", a.get("name","")) for a in gitee_atts(rid)}
              for a in rel.get("assets", []):
                  an = a["name"]
                  if an.endswith(("-source.zip","-source.tar.gz",".source.zip")): continue
                  if an in have: continue
                  print(f"B: {tag} <- {an} ({a['size']/1048576:.1f}MB)")
                  dest = f"/tmp/a_{a['id']}"
                  try:
                      gh_download(a["id"], dest)
                      if gitee_upload(rid, dest): ok += 1
                      else: fail += 1; print(f"  !! upload failed {tag}/{an}")
                  except Exception as e:
                      fail += 1; print(f"  !! {e}")
                  finally:
                      if os.path.exists(dest): os.remove(dest)
                  time.sleep(8)

          # ---- Phase C: re-upload pool assets
          for tag, aname in POOL:
              rel = next(r for r in rels_gh if r["tag_name"]==tag)
              a = next(x for x in rel["assets"] if x["name"]==aname)
              o = subprocess.run(["curl","-s","--max-time","120",
                  f"{GE}/repos/lingion/sleepy/releases/tags/{tag}?access_token={GITEE_TOKEN}"],
                  capture_output=True, text=True)
              rid = json.loads(o.stdout)["id"]
              have = {re.sub(r"^(sleepy|asset)_\d+_(.*)", r"\2", x.get("name","")) for x in gitee_atts(rid)}
              if aname in have:
                  print(f"C: {tag}/{aname} already present"); continue
              print(f"C: re-upload {tag}/{aname} ({a['size']/1048576:.1f}MB)")
              dest = f"/tmp/c_{a['id']}"
              try:
                  gh_download(a["id"], dest)
                  if gitee_upload(rid, dest): ok += 1
                  else: fail += 1; print(f"  !! pool re-upload failed")
              except Exception as e:
                  fail += 1; print(f"  !! {e}")
              finally:
                  if os.path.exists(dest): os.remove(dest)
              time.sleep(8)

          # ---- Phase D: final verification, every GH asset must exist on Gitee by name
          rels_g = gitee_releases()
          gitee_have = set()
          for r in rels_g:
              for a in r.get("assets") or []:
                  n = re.sub(r"^(sleepy|asset)_\d+_", "", a.get("name",""))
                  if not (n == f"{r['tag_name']}.zip" or n == f"{r['tag_name']}.tar.gz"):
                      gitee_have.add(f"{r['tag_name']}|{n}")
          missing = []
          for rel in rels_gh:
              for a in rel.get("assets", []):
                  an = a["name"]
                  if an.endswith(("-source.zip","-source.tar.gz",".source.zip")): continue
                  if f"{rel['tag_name']}|{an}" not in gitee_have:
                      missing.append(f"{rel['tag_name']}|{an}")
          print(f"D: verification -> ok={ok} fail={fail} missing={len(missing)}")
          for m in missing: print(f"   MISSING {m}")
          sys.exit(1 if (fail or missing) else 0)
          PYEOF
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
