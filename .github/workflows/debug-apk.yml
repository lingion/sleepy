name: Debug APK Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支/标签/commit (默认 main)"
        required: false
        default: "main"
      abi:
        description: "打包架构"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - universal

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: List APK outputs
        run: ls -la app/build/outputs/apk/debug/
      - name: Select artifact ABI
        id: pick
        run: |
          abi="${{ inputs.abi }}"
          case "$abi" in
            all) pattern="*" ;;
            *)   pattern="app-${abi}-debug.apk" ;;
          esac
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sleepy-debug-apk-${{ inputs.abi }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/${{ steps.pick.outputs.pattern }}
          if-no-files-found: error
          retention-days: 7
