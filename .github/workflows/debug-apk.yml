name: Debug APK Build
run-name: Debug APK · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }} · input=${{ inputs.ref || github.event.pull_request.head.sha || github.sha }} · ${{ inputs.abi || 'all' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      ref:
        description: '源码分支/标签/完整 SHA；留空跟随上方所选工作流分支，不默认覆盖为 main'
        required: false
        default: ''
        type: string
      abi:
        description: 'APK 架构；V7A 选择 armeabi-v7a，all 分别提供四种下载'
        required: false
        default: all
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - universal

permissions:
  contents: read

# Cancel obsolete PR runs before a delayed prepare job can overtake a newer run.
# Other entries use per-target, case-sensitive hashed concurrency in the build job.
concurrency:
  group: debug-event-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.repository, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'push' || github.event.repository.fork || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      source_repository: ${{ steps.plan.outputs.source_repository }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
      abi: ${{ steps.plan.outputs.abi }}
      concurrency_key: ${{ steps.plan.outputs.concurrency_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: tooling
      - name: Resolve event, source and build identity
        id: plan
        run: python3 -I tooling/scripts/debug_ci.py plan --plan "$RUNNER_TEMP/debug-plan.json"

  assemble-debug:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: debug-apk-${{ needs.prepare.outputs.concurrency_key }}
      cancel-in-progress: true
    env:
      ABI: ${{ needs.prepare.outputs.abi }}
    steps:
      # Tooling follows this workflow revision, not an arbitrary old target's scripts.
      - uses: actions/checkout@v7
        id: tooling
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: tooling
      - name: Resolve immutable source plan
        run: |
          python3 -I tooling/scripts/debug_ci.py plan --plan "$RUNNER_TEMP/debug-plan.json"
          printf 'SLEEPY_DEBUG_KEYSTORE=%s/debug.keystore\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.source_repository }}
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Verify source commit and merge PR into latest main
        id: revision
        run: >-
          python3 -I tooling/scripts/debug_ci.py prepare
          --plan "$RUNNER_TEMP/debug-plan.json"
          --source "$GITHUB_WORKSPACE/source"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Arbitrary manually selected code must never publish caches to main's scope.
          cache-read-only: true
      # 构建阶段仅用一次性密钥；官方密钥只存在于独立签名 runner。
      - name: Create build-only debug signing key
        shell: bash
        run: |
          umask 077
          keytool -genkeypair -keystore "$SLEEPY_DEBUG_KEYSTORE" -storepass android -keypass android \
            -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Record intended signing certificate before target execution
        id: certificate
        shell: bash
        run: |
          certificate_sha256=$(keytool -exportcert -keystore "$SLEEPY_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          printf 'sha256=%s\n' "$certificate_sha256" >> "$GITHUB_OUTPUT"
      - name: Assemble selected debug ABI
        working-directory: source
        shell: bash
        run: |
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace \
            --init-script "$GITHUB_WORKSPACE/tooling/.github/ci/debug-abi.init.gradle" \
            "-Psleepy.buildAbi=$ABI"
      - name: Verify and stage identified APKs
        id: package
        env:
          SIGNING_MODE: ephemeral
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
          EXPECTED_CERTIFICATE_SHA256: ${{ steps.certificate.outputs.sha256 }}
        run: >-
          python3 -I tooling/scripts/debug_ci.py package
          --plan "$RUNNER_TEMP/debug-plan.json"
          --source "$GITHUB_WORKSPACE/source"
          --destination "$RUNNER_TEMP/debug-artifacts"
      - name: Upload signing input (not an official install package)
        uses: actions/upload-artifact@v7
        with:
          name: debug-signing-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug-artifacts/
          if-no-files-found: error
          retention-days: 1
      - name: Build identity and download summary
        if: ${{ always() && steps.tooling.outcome == 'success' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 -I tooling/scripts/debug_ci.py summary
          --plan "$RUNNER_TEMP/debug-plan.json"
          --destination "$RUNNER_TEMP/debug-artifacts"
