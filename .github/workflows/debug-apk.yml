name: Debug APK Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支/标签/commit (默认 main)"
        required: false
        default: "main"
      abi:
        description: "打包架构"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - universal

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install project debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "使用项目 debug 密钥签名 (与本机一致)"
          else
            echo "未配置 DEBUG_KEYSTORE_BASE64, 回退 runner 一次性密钥 (跨构建不可覆盖安装)"
          fi
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: List APK outputs
        run: ls -la app/build/outputs/apk/debug/
      - name: Select artifact ABI
        id: pick
        run: |
          abi="${{ inputs.abi }}"
          case "$abi" in
            all) pattern="*" ;;
            *)   pattern="app-${abi}-debug.apk" ;;
          esac
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: sleepy-debug-apk-${{ inputs.abi }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/${{ steps.pick.outputs.pattern }}
          if-no-files-found: error
          retention-days: 7
