name: Release

# tag 触发发布 (治理阶段4): 跑测试 → assembleRelease → 以 docs/release-notes-v<ver>.md
# 为 body 建 GitHub Release (notes 手写双语, 自动化只搬运不生成) → 上传 APK 附件。
# Gitee 镜像由 sync-to-gitee.yml 以 GitHub Release 为真源自动接管 (release 事件)。

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES="docs/release-notes-v${VER}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::缺少 $NOTES — 发布前必须先写好双语 release notes 并随 tag 提交"
            exit 1
          fi
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
        id: notes

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 secret RELEASE_KEYSTORE_BASE64 — 发布必须用项目既有签名密钥, 禁止退回 CI debug 密钥 (会让用户从旧版升级触发签名警告)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "SLEEPY_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "SLEEPY_KEYSTORE_PASSWORD=android"
            echo "SLEEPY_KEY_ALIAS=androiddebugkey"
            echo "SLEEPY_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signing certificate
        run: |
          EXPECTED="5d97522ba8fab0c14abcd814fe92bb0def199149abd0df72401a528087b70f09"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          ok=1
          for apk in app/build/outputs/apk/release/*.apk; do
            got=$("$APKSIGNER" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/{print $2; exit}' | tr 'A-Z' 'a-z')
            echo "$(basename "$apk"): $got"
            [ "$got" = "$EXPECTED" ] || ok=0
          done
          if [ "$ok" != "1" ]; then
            echo "::error::APK 签名证书与项目既有密钥 ($EXPECTED) 不符 — 拒绝发布, 防止用户升级签名警告"
            exit 1
          fi
          echo "签名证书校验通过: 全部 APK 均为项目既有密钥"

      - name: Collect APK artifacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          cd dist
          sha256sum *.apk > sha256sums.txt
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Sleepy v${VER}" \
            --notes-file "${{ steps.notes.outputs.notes }}" \
            dist/*
