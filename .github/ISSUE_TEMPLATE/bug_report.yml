name: Bug Report
description: Report a bug in Sleepy. Auto-pre-filled by the app with diagnostic info.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve Sleepy! Please fill in the sections below.
        The diagnostic block is auto-generated by the app — don't edit it.

        ---

        > **你的学校还没支持?或教务系统课表抓取失败?**
        > 走 [采集教程](https://github.com/lingion/sleepy/blob/main/docs/adapt-kit/README.md) 跑一份 `sleepy-adapt.zip` 附在这里 —— 比纯文字描述快 10 倍, 通常 1-2 天内完成适配。
        > 工具支持 Windows / macOS (Apple Silicon & Intel) / Linux。
        >
        > **Already-supported school returns HTTP 500 / blank schedule?** This template still applies — attach a fresh `sleepy-adapt.zip` if you have one; otherwise paste the failing network request URL + response body from Chrome DevTools Network tab.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: "Prerequisites"
      options:
        - label: I am using the latest version of Sleepy
          required: true
        - label: I have searched existing issues and found no duplicate
          required: true
        - label: I will attach logs, screenshots, or a sample schedule file if helpful
          required: false
  - type: textarea
    id: current
    attributes:
      label: "Current behavior"
      description: "What goes wrong? Be specific."
      placeholder: "When I import my schedule HTML, Sleepy shows an empty list instead of my classes."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What should happen instead?"
      placeholder: "Sleepy should parse my classes and display them on the timetable."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      description: "How can we reproduce this on our device?"
      placeholder: |
        1. Open Sleepy
        2. Tap "Import"
        3. Choose my exported HTML file
        4. See empty list
    validations:
      required: true
  - type: input
    id: scheduleSource
    attributes:
      label: "Schedule source"
      description: "Which university or export tool generated the file?"
      placeholder: "e.g. xxx 大学教务系统 / 超级课程表 / WakeUp / ICS"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Anything else relevant (logs, screenshots, workarounds)."
    validations:
      required: false
  - type: textarea
    id: diagnostic
    attributes:
      label: "Diagnostic info (auto-filled by app)"
      description: "Auto-generated by Sleepy on launch. Please don't edit unless asked."
      render: markdown
    validations:
      required: false