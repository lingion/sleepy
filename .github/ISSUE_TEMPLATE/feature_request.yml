name: Feature Request
description: Suggest a new feature or improvement for Sleepy.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you would like Sleepy to do. The diagnostic block is auto-generated by the app.

        ---

        > **想让你的学校支持教务直连?**
        > 走 [采集教程](https://github.com/lingion/sleepy/blob/main/docs/adapt-kit/README.md) 跑一份 `sleepy-adapt.zip` 附在这里 —— 通常 1-2 天内完成适配, 不需要你写代码。
        > 工具有 Windows / macOS (Apple Silicon & Intel) / Linux 三个版本。
        >
        > 提示:如果你只是想给**已支持**的 179 所学校提改进(排序 / 配色 / 字段), 用其他模板, 这个模板是给"加新学校"用的。
  - type: checkboxes
    id: prerequisites
    attributes:
      label: "Prerequisites"
      options:
        - label: I have searched existing issues and found no duplicate
          required: true
        - label: I have confirmed this feature is not already in the latest release
          required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem or motivation"
      description: "What problem does this solve? Why does it matter to you?"
      placeholder: "I keep forgetting to bring my laptop to class — I want Sleepy to remind me at 7:50 every morning."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution"
      description: "How would you like Sleepy to behave?"
      placeholder: "Add a daily reminder card on the home page that lists the day's classes."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Other approaches you considered and why you rejected them."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Screenshots, mockups, links — anything that helps us visualize."
    validations:
      required: false
  - type: textarea
    id: diagnostic
    attributes:
      label: "Diagnostic info (auto-filled by app)"
      description: "Auto-generated by Sleepy on launch. Please don't edit unless asked."
      render: markdown
    validations:
      required: false