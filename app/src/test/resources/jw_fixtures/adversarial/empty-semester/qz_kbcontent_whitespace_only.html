<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>学生个人课表 - 占位</title>
</head>
<body>
<!-- 强智 QZ 对抗: kbtable 存在, td 有 div.kbcontent 结构但内容只有空白 / <br>.
     学期初教务系统已初始化课表格子但还没写课程数据.
     JwQzParser.generateCourseList 行 106 courseElements = div.getElementsByClass('kbcontent'),
     行 107 courseElements.text().isBlank() → continue 跳过, 不会调 convert.
     同格只有 <br> 的变体也一样.
-->
<table id="kbtable" border="0" cellspacing="0" cellpadding="0">
  <thead>
    <tr>
      <td>节次\星期</td>
      <td>星期一</td><td>星期二</td><td>星期三</td><td>星期四</td>
      <td>星期五</td><td>星期六</td><td>星期日</td>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>第一节</td>
      <td><div class="kbcontent">   </div></td>
      <td><div class="kbcontent"><br></div></td>
      <td><div class="kbcontent">&nbsp;</div></td>
      <td><div class="kbcontent"></div></td>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
    </tr>
    <tr>
      <td>第二节</td>
      <td><div class="kbcontent">-----</div></td>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
    </tr>
  </tbody>
</table>
</body>
</html>
