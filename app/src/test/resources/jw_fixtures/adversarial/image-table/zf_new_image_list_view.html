<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>我的课表</title>
</head>
<body>
<!-- 新版正方 jwglxt 真实 DOM: #kbgrid_table_0 (Vue/ElementUI 渲染) 的 td_wrap 单元格内
     只塞 <img>, 无 .kbcontent 容器, 无 .title/.p font 结构
     sleepy JwNewZfParser 的容器选择链不包含 #kbgrid_table_0 前缀匹配 -->
<div id="kbgrid_table_0" class="el-table">
  <table class="el-table__body">
    <tbody>
      <tr>
        <td class="el-table_1_column_1">
          <div class="cell">
            <div class="td_wrap">
              <img src="/img/zfnew_mon.png" alt="周一课程" />
            </div>
          </div>
        </td>
      </tr>
      <tr>
        <td class="el-table_1_column_2">
          <div class="cell">
            <div class="td_wrap">
              <img src="/img/zfnew_tue.png" alt="周二课程" />
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
