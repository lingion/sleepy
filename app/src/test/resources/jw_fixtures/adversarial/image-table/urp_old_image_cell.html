<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>个人课表</title>
</head>
<body>
<!-- 老版 URP displayTag 表格: 课程名/教师/星期/节次/周次/教学楼/教室/节数 等列,
     课程名列整格为 <img>(部分学校以截图方式渲染课程名), 教师/教室列也含图片占位 -->
<table class="displayTag">
  <thead>
    <tr>
      <th>课程名</th>
      <th>教师</th>
      <th>星期</th>
      <th>节次</th>
      <th>周次</th>
      <th>教学楼</th>
      <th>教室</th>
      <th>节数</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><img src="/img/course1.png" alt="高等数学" /></td>
      <td><img src="/img/teacher1.png" alt="王老师" /></td>
      <td>1</td>
      <td>1-2</td>
      <td>1-16</td>
      <td>教一</td>
      <td><img src="/img/room1.png" alt="101" /></td>
      <td>2</td>
    </tr>
    <tr>
      <td><img src="/img/course2.png" alt="大学英语" /></td>
      <td><img src="/img/teacher2.png" alt="李老师" /></td>
      <td>3</td>
      <td>3-4</td>
      <td>1-16周(单)</td>
      <td>外语楼</td>
      <td><img src="/img/room2.png" alt="205" /></td>
      <td>2</td>
    </tr>
  </tbody>
</table>
</body>
</html>
