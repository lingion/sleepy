<!--
  老正方 Table1 "纯组头行" 变体 (icharle/jwxt 广东白云学院 Getkebian())。

  research finding 9 (老正方交叉对比三):
    该校 Table1 首列是 早晨/上午/下午/晚上 四个组头, 无任何 "第N节" 逐节行头;
    其 PHP 实现自己做了换算: 上午→第1节, 下午→第5节, 晚上→第9节 (1/5/9 为该校专属作息,
    其他学校不同). sleepy/upstream 对 组头词 一律 OTHER_HEADER.contains → continue 跳过,
    且 node 永远不被赋值, 保持 -1.

  本 fixture 结构:
    row0  表头 (节次\星期 + 星期一~日)
    row1  早晨 (空行, OTHER_HEADER 命中 continue)
    row2  上午  + 3 门课格 (countDay=1/2/3, node 仍 -1)
    row3  下午  + 1 门课格 (countDay=1, node 仍 -1)
    row4  晚上  + 1 门课格 (countDay=1, node 仍 -1)

  关键对抗点: 每个组头行都把 countFlag 拉成... 等等 — 组头词命中 OTHER_HEADER 是
  continue, 不设置 countFlag! 所以 row2 的 3 个空格 td (len<=1) 都不递增 countDay
  (L35-38: if countFlag 才递增). 即 countDay 只在 countFlag=true 后才计数.

  而本页没有任何 "第N节" 行头, countFlag 从未置 true → 所有空格 td 都不算数,
  countDay 恒为 0 → 每行的第一格课程 cDay=1!  3 门课全塌缩到周一.

  (注: 课程 timeInfo 都带 "周X" 前缀, importList2CourseList L159 会用 timeInfo 前缀
   救回 day — 但若去掉 周X 前缀, day 全部塌缩为 1. startNode 恒 -1, 节次全丢.)
-->
<table id="Table1" border="1" cellspacing="0" cellpadding="0">

    <td align="Center">星期一</td>

  </tr>
