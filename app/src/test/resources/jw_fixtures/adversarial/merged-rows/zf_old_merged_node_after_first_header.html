<!--
  老正方 Table1 type=0 + 合并节次行头("第N-M节") + countFlag 已 true 的对抗样本。

  research finding("第N-M节 合并节次行头是盲区") + 真实风险:
    HEADER_NODE_PATTERN=第.*节  matches → nodeStr="3-4" → toIntOrNull()=null
    → CN_NUM["3-4"]=null → 返回 -1 → parseHeaderNodeString 不当行头处理
    → countDay++ 被执行 (行已被前面行头激活 countFlag=true)
    → 整行课程的 day 整体 +1 错位 (大学英语从周三落周四, 大学物理从周五落周六).

  本 fixture 故意:
    ① 第1行  第一节  含课 (countFlag=true, countDay 已能正确推进)
    ② 第2行  第3-4节 合并行头(被当课格 countDay++, day 全 +1)
    ③ 第3行  第五节  含课(行头正常解析 node=5)

  真实对应现象: 临沂大学/聊城大学/南京信息工程大学等老正方部署出现
  "上午/下午/晚上" 三个组头之间各插一行 "第N-M节" 合并节次行头
  (research citing kechengbiao blackList 含 "中午" 但合并行头未列).

  上游/sleepy 现版缺陷(均为已知):
    - parseHeaderNodeString 第218行: HEADER_NODE_PATTERN.matches(str) 命中"第N-M节" →
      nodeStr="3-4" → toIntOrNull()=null → CN_NUM=null → return -1, 不当行头.
    - 主循环 L31-49: 当 result==-1 → countDay++ (countFlag=true 时),
      把整行课程落错星期列.
    - T1 推荐修复: HEADER_NODE_PATTERN matches 但 nodeStr 含 "-" 时按 node=N(=首段数字)
      解析且不执行 countDay++ (research recommendations 项 "合并节次行头按 node=N 处理").

  parser 验证点:
    - pre_fix (现版 JwOldZfParser): 大学英语 day=4(原 day=3 错位), 大学物理 day=6(原 day=5 错位)
    - post_fix: day=3 / day=5; startNode=3/endNode=4(从"3-4"解析).
-->
