//根据用户帐号选择登录服务器
function selectServer(uName){
	var enableServers = true;//是否启用多服务器 true/false
	var serversArray = new Array();//服务器列表


		serversArray[0] = "http://192.168.113.131:80/jsxsd/";

		serversArray[1] = "http://192.168.113.132:80/jsxsd/";

		serversArray[2] = "http://192.168.113.137:80/jsxsd/";

		serversArray[3] = "http://192.168.113.133:80/jsxsd/";

		serversArray[4] = "http://192.168.113.134:80/jsxsd/";

		serversArray[5] = "http://192.168.113.138:80/jsxsd/";

		serversArray[6] = "http://192.168.113.135:80/jsxsd/";

		serversArray[7] = "http://192.168.113.136:80/jsxsd/";


var loginUrl = "xk/LoginToXk";
if(enableServers == true){
	if(!isNaN(uName)){//必须为数字
		var modVal = eval(uName % serversArray.length);
		loginUrl = serversArray[modVal] + loginUrl;
	}else{
		loginUrl = serversArray[0] + loginUrl;
	}
}else{
	loginUrl = ""+ loginUrl;
}
return loginUrl;
